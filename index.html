<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#04110b">
<title>Fulbazo · Generador de Placas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Baloo+2:wght@600;700;800&family=Bebas+Neue&family=Inter:wght@400;600;700;800&family=Lobster&family=Montserrat:wght@600;700;800;900&family=Nunito:wght@400;600;700;800;900&family=Oswald:wght@500;600;700&family=Playfair+Display:wght@700;800;900&family=Poppins:wght@600;700;800&family=Righteous&family=Roboto+Condensed:wght@700&family=Rubik:wght@600;700;800&family=Russo+One&family=Space+Grotesk:wght@600;700&family=Teko:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

<header class="topbar">
  <div class="brandmark">
    <img class="brand-logo" src="assets/logo.png" alt="Fulbazo">
    <div><div class="tb-title">Fulbazo Placas</div><div class="tb-sub">Generador de gráficas para tus redes</div></div>
  </div>
  <div class="topbar-actions">
    <span class="size-info" id="sizeInfo">1080 × 1080 px</span>
    <button class="btn-dl" id="dl">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 4v10m0 0 4-4m-4 4-4-4M5 18h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="dlLabel">Descargar PNG</span>
    </button>
  </div>
</header>

<div class="layout">
  <!-- ===================== PANEL DE CONTROLES ===================== -->
  <aside class="sidebar">

    <section class="sec"><h3>Formato</h3>
      <div class="sizes" id="sizes">
        <div class="size sel" data-s="square">Post<span class="lbl">1080×1080</span></div>
        <div class="size" data-s="story">Story / Reel<span class="lbl">1080×1920</span></div>
        <div class="size" data-s="land">Twitter / X<span class="lbl">1600×900</span></div>
      </div>
    </section>

    <section class="sec"><h3>Plantilla</h3>
      <div class="types" id="types"></div>
    </section>

    <section class="sec"><h3>Tipografía</h3>
      <div class="row2">
        <div class="field"><label>Títulos / números</label><select id="fontDisp"></select></div>
        <div class="field"><label>Texto</label><select id="fontBody"></select></div>
      </div>
    </section>

    <section class="sec"><h3>Color de acento</h3>
      <div class="colors" id="colors"></div>
      <input type="color" id="custompick" style="display:none">
      <div class="field" style="margin-top:10px"><label>Color del texto</label><input type="color" id="textColor" value="#ffffff"></div>
    </section>

    <section class="sec"><h3>Fondo</h3>
      <div class="bgs" id="bgs"></div>
      <div class="bg-custom" id="bgCustom" hidden>
        <div class="row2">
          <div class="field"><label>Color 1</label><input type="color" id="bgC1"></div>
          <div class="field"><label>Color 2</label><input type="color" id="bgC2"></div>
        </div>
        <div class="field"><label>Ángulo · <span id="bgAngleVal">160°</span></label><input type="range" id="bgAngle" min="0" max="360" value="160"></div>
      </div>
      <label class="switch"><input type="checkbox" id="glow" checked> Brillo de acento detrás</label>
    </section>

    <section class="sec"><h3>Estilo</h3>
      <div class="field"><label>Redondeo de esquinas · <span id="radiusVal">18px</span></label><input type="range" id="radius" min="0" max="40" value="18"></div>
    </section>

    <section class="sec"><h3>Logo</h3>
      <div class="logos" id="logos"></div>
      <div class="field" style="margin-top:8px"><label>Logo personalizado (PNG/SVG)</label><input type="file" id="logoUpload" accept="image/*"></div>
      <button class="btn-ghost" id="logoReset">Quitar logo subido</button>
    </section>

    <section class="sec"><h3>Marca / pie</h3>
      <div class="field"><input id="brand"></div>
    </section>

    <section class="sec"><h3>Datos</h3>
      <div id="controls"></div>
    </section>
  </aside>

  <!-- divisor arrastrable: agranda / achica el panel izquierdo -->
  <div class="resizer" id="resizer" title="Arrastrá para agrandar el panel · doble clic para resetear"></div>

  <!-- ===================== ESCENARIO / VISTA PREVIA ===================== -->
  <main class="stage">
    <div class="stage-canvas">
      <div class="placa-scale" id="placaScale"><div id="placaHolder"></div></div>
    </div>
    <div class="stage-bar">
      <span class="stage-chip">Vista previa en vivo</span>
      <span class="stage-chip muted">Zoom <b id="zoomInfo">100%</b></span>
    </div>
  </main>
</div>

<script src="js/data.js"></script>
<script src="js/state.js"></script>
<script src="js/render.js"></script>
<script src="js/controls.js"></script>
<script src="js/app.js"></script>
</body>
</html>
